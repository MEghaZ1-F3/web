<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 25px; background: #faf7f2; color: #23201d; margin: 0; }
        .box { background: white; border: 1px solid #ece6dc; border-left: 5px solid #d88c78; padding: 20px; border-radius: 6px; }
        button { background: #3a5a40; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 15px; font-weight: 600; }
    </style>
</head>
<body>
    <h2>PHP Cookie Last Visit Tracker</h2>
    <div class="box">
        <p id="visitInfo">Welcome Back! Last visited on: <b style="color:#d88c78;">24-Aug-2026 10:15:00 AM</b></p>
        <p>New Cookie Created: <b id="currTime"></b></p>
        <button onclick="simulateReopen()">Simulate Page Reopening</button>
    </div>
    <script>
        document.getElementById('currTime').innerText = new Date().toLocaleString();
        function simulateReopen() {
            const saved = document.getElementById('currTime').innerText;
            document.getElementById('visitInfo').innerHTML = "Welcome Back! Last visited on: <b style='color:#d88c78;'>" + saved + "</b>";
            document.getElementById('currTime').innerText = new Date().toLocaleString();
        }
    </script>
</body>
</html>
